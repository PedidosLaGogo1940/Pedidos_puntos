<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido de insumos · La GoGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F7EEDD;
    --cream-dark: #ECDFC0;
    --crust: #4A2E1E;
    --ink: #2B1B12;
    --wheat: #C1892F;
    --wheat-dark: #A8721F;
    --brick: #8C3B2E;
    --line: #DCCBA0;
    --white: #FFFDF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  header{
    background:var(--crust);
    color:var(--cream);
    padding:22px 20px 20px;
    border-bottom:4px solid var(--wheat);
  }
  header .marca{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
  }
  header .sub{
    margin:4px 0 0;
    font-size:13.5px;
    color:#E7D9BC;
  }
  .contenido{
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 0;
  }
  .tarjeta-punto{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .tarjeta-punto label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--crust);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  select#punto{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink);
  }
  .categoria{
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    background:var(--white);
    overflow:hidden;
  }
  .categoria-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .categoria-header h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0;
    color:var(--crust);
  }
  .categoria-meta{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .contador{
    font-size:12.5px;
    font-weight:600;
    color:var(--wheat-dark);
    background:var(--cream-dark);
    border-radius:20px;
    padding:3px 10px;
    min-width:20px;
    text-align:center;
  }
  .flecha{
    width:11px;
    height:11px;
    border-right:2px solid var(--crust);
    border-bottom:2px solid var(--crust);
    transform:rotate(45deg);
    transition:transform .18s ease;
    margin-right:2px;
  }
  .categoria.abierta .flecha{ transform:rotate(-135deg); }
  .lista-items{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
  }
  .lista-items-inner{
    padding:0 14px 6px;
  }
  .fila-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 2px;
    border-top:1px solid var(--cream-dark);
  }
  .fila-item:first-child{ border-top:none; }
  .fila-item input[type=checkbox]{
    width:22px;
    height:22px;
    flex-shrink:0;
    accent-color:var(--wheat-dark);
  }
  .fila-item .nombre{
    flex:1;
    font-size:15px;
    line-height:1.3;
  }
  .fila-item input.cantidad{
    width:78px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:7px 8px;
    border:1.5px solid var(--line);
    border-radius:7px;
    text-align:center;
    display:none;
    background:var(--cream);
  }
  .fila-item.marcado input.cantidad{ display:block; }
  .fila-item.marcado .nombre{ color:var(--crust); font-weight:600; }

  .nota-bloque{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:20px;
  }
  .nota-bloque label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--crust);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  textarea#nota{
    width:100%;
    min-height:60px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    resize:vertical;
    background:var(--white);
  }

  .banner{
    border-radius:9px;
    padding:11px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    display:none;
  }
  .banner.error{
    background:#F6E2DC;
    color:var(--brick);
    border:1px solid #E0B4A6;
  }
  .banner.exito{
    background:#E7EFD8;
    color:#3F5A25;
    border:1px solid #C7DBA4;
  }
  .banner.mostrar{ display:block; }

  footer{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--crust);
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 -3px 14px rgba(0,0,0,.18);
  }
  footer .resumen{
    color:#E7D9BC;
    font-size:13px;
    line-height:1.25;
  }
  footer .resumen strong{
    color:var(--cream);
    font-size:15px;
    display:block;
  }
  button#enviar{
    background:var(--wheat);
    color:var(--crust);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 20px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
  }
  button#enviar:disabled{
    background:#8A7756;
    color:#D9CBA8;
    cursor:not-allowed;
  }
  button#enviar.cargando{ opacity:.75; }
</style>
</head>
<body>

<header>
  <p class="marca">La GoGo</p>
  <p class="sub">Pedido de insumos por punto · marca lo que se necesita y envía</p>
</header>

<div class="contenido">

  <div class="tarjeta-punto">
    <label for="punto">Tu punto</label>
    <select id="punto">
      <option value="">Selecciona tu punto…</option>
      <option value="QUINTA">Quinta</option>
      <option value="VERGEL">Vergel</option>
      <option value="POLA">Pola</option>
      <option value="PIEDRA PINTADA">Piedra Pintada</option>
    </select>
  </div>

  <div class="banner error" id="banner-error"></div>
  <div class="banner exito" id="banner-exito"></div>

  <div id="categorias"></div>

  <div class="nota-bloque">
    <label for="nota">Algo más que quieras aclarar (opcional)</label>
    <textarea id="nota" placeholder="Ej: la leche entera se acaba hoy mismo, urgente."></textarea>
  </div>

</div>

<footer>
  <div class="resumen">
    <strong id="conteo-seleccion">0 productos</strong>
    seleccionados
  </div>
  <button id="enviar">Enviar pedido</button>
</footer>
 
const CONFIG = {
  sheetWebhookUrl: "https://script.google.com/macros/s/AKfycbz-PtCHHTzZJg-8gJKGyi_a0gSSQqlNmRyOj51sRjHLcjVu7PF4pvqOXLip1VlDrOQ1/exec"
   }

<script>
  var DATOS = [
    { categoria: "Bebidas y desechables de barra", items: [
      "Masato","Kumis","Nescafé Tradición","Capuchino rojo","Capuchino vainilla","Milo",
      "Vasos 6 oz","Vasos 9 oz","Vasos obsequio 7 oz","Vaso 16 oz","Tapas 6 oz","Tapas 9 oz",
      "Mezcladores","Cucharas","Azúcar en sobre","Leche deslactosada","Leche entera","Huevos"
    ]},
    { categoria: "Bolsas y empaques", items: [
      "Bolsa para calado","Bolsa para cuca","Bolsa para pan grande","Bolsa manija La GoGo",
      "Bolsa manija grande","Bolsa para tapar pan","Bolsa de la basura"
    ]},
    { categoria: "Cajas y contenedores", items: [
      "Cajas porción","Cajas media libra","Cajas de libra","Domos fantasía personal","Contenedores muffin"
    ]},
    { categoria: "Papelería, cocina y despacho", items: [
      "Papel aluminio","Papel sulfito","Palillo extralargo","Rollo de impresora",
      "Hojas de inventario","Hojas de baja"
    ]},
    { categoria: "Aseo", items: [
      "Jabón de loza crema","Jabón de loza líquido","Jabón líquido de manos","Citronela",
      "Desengrasante","Limpiavidrios","Waypall","Papel higiénico","Servilletas","Jabón en polvo",
      "Guantes de manipulación de alimentos","Esponja","Insecticida","Toallas de mano",
      "Servilletas de lujo","Blanqueador","Varsol emulsionado","Vinagre","Trapero","Ambientador",
      "Bolsa precorte 8","Bolsa precorte 6","Bolsa precorte 10","Bolsa precorte 12"
    ]}
  ];

  var cont = document.getElementById('categorias');

  DATOS.forEach(function(grupo, gi){
    var wrap = document.createElement('div');
    wrap.className = 'categoria';

    var head = document.createElement('div');
    head.className = 'categoria-header';
    head.innerHTML =
      '<h2>' + grupo.categoria + '</h2>' +
      '<div class="categoria-meta"><span class="contador" data-cont="'+gi+'">0</span><span class="flecha"></span></div>';

    var lista = document.createElement('div');
    lista.className = 'lista-items';
    var inner = document.createElement('div');
    inner.className = 'lista-items-inner';

    grupo.items.forEach(function(nombre, ii){
      var fila = document.createElement('div');
      fila.className = 'fila-item';
      var id = 'chk-' + gi + '-' + ii;
      fila.innerHTML =
        '<input type="checkbox" id="'+id+'" data-cat="'+grupo.categoria+'" data-nombre="'+nombre+'">' +
        '<span class="nombre">'+nombre+'</span>' +
        '<input type="text" class="cantidad" placeholder="Cant.">';
      inner.appendChild(fila);
    });

    lista.appendChild(inner);
    wrap.appendChild(head);
    wrap.appendChild(lista);
    cont.appendChild(wrap);

    head.addEventListener('click', function(){
      var abierta = wrap.classList.contains('abierta');
      if (abierta){
        wrap.classList.remove('abierta');
        lista.style.maxHeight = null;
      } else {
        wrap.classList.add('abierta');
        lista.style.maxHeight = inner.scrollHeight + 'px';
      }
    });
  });

  document.querySelectorAll('.fila-item input[type=checkbox]').forEach(function(chk){
    chk.addEventListener('change', function(){
      var fila = chk.closest('.fila-item');
      fila.classList.toggle('marcado', chk.checked);
      actualizarContadores();
    });
  });

  function actualizarContadores(){
    var total = 0;
    document.querySelectorAll('.categoria').forEach(function(cat, gi){
      var marcados = cat.querySelectorAll('.fila-item.marcado').length;
      var badge = cat.querySelector('.contador');
      badge.textContent = marcados;
      total += marcados;
      var lista = cat.querySelector('.lista-items');
      if (cat.classList.contains('abierta')){
        lista.style.maxHeight = cat.querySelector('.lista-items-inner').scrollHeight + 'px';
      }
    });
    document.getElementById('conteo-seleccion').textContent = total + (total===1 ? ' producto' : ' productos');
  }

  function mostrarError(msg){
    var b = document.getElementById('banner-error');
    b.textContent = msg;
    b.classList.add('mostrar');
    document.getElementById('banner-exito').classList.remove('mostrar');
  }
  function mostrarExito(msg){
    var b = document.getElementById('banner-exito');
    b.textContent = msg;
    b.classList.add('mostrar');
    document.getElementById('banner-error').classList.remove('mostrar');
  }

  var NUMERO_WHATSAPP = '573176398636';

  document.getElementById('enviar').addEventListener('click', function(){
    var boton = this;
    var punto = document.getElementById('punto').value;
    var nota = document.getElementById('nota').value.trim();
    var marcados = document.querySelectorAll('.fila-item.marcado');

    if (!punto){
      mostrarError('Selecciona tu punto antes de enviar el pedido.');
      return;
    }
    if (marcados.length === 0){
      mostrarError('Marca al menos un producto que necesites.');
      return;
    }

    var items = [];
    marcados.forEach(function(fila){
      var chk = fila.querySelector('input[type=checkbox]');
      var cant = fila.querySelector('input.cantidad').value.trim();
      items.push({
        categoria: chk.getAttribute('data-cat'),
        producto: chk.getAttribute('data-nombre'),
        cantidad: cant
      });
    });

    boton.disabled = true;
    boton.classList.add('cargando');
    boton.textContent = 'Enviando…';

    var pedido = { punto: punto, nota: nota, items: items };

    google.script.run
      .withSuccessHandler(function(){
        enviarWhatsApp(pedido);
        mostrarExito('Pedido guardado. Abriendo WhatsApp para confirmarlo…');
        boton.disabled = false;
        boton.classList.remove('cargando');
        boton.textContent = 'Enviar pedido';
      })
      .withFailureHandler(function(err){
        mostrarError('No se pudo guardar el pedido. Intenta de nuevo. (' + err.message + ')');
        boton.disabled = false;
        boton.classList.remove('cargando');
        boton.textContent = 'Enviar pedido';
      })
      .guardarPedido(pedido);
  });

  function enviarWhatsApp(pedido){
    var fecha = new Date().toLocaleDateString('es-CO', { day:'2-digit', month:'2-digit', year:'numeric' });
    var texto = 'Pedido de insumos - La GoGo\nPunto: ' + pedido.punto + '\nFecha: ' + fecha + '\n\n';

    var porCategoria = {};
    pedido.items.forEach(function(it){
      if (!porCategoria[it.categoria]) porCategoria[it.categoria] = [];
      porCategoria[it.categoria].push(it.producto + (it.cantidad ? ' x' + it.cantidad : ''));
    });

    Object.keys(porCategoria).forEach(function(cat){
      texto += '*' + cat + '*\n';
      porCategoria[cat].forEach(function(linea){ texto += '- ' + linea + '\n'; });
      texto += '\n';
    });

    if (pedido.nota){
      texto += 'Nota: ' + pedido.nota;
    }

    var url = 'https://wa.me/' + NUMERO_WHATSAPP + '?text=' + encodeURIComponent(texto);
    window.open(url, '_blank');
  }
</script>

</body>
</html>
