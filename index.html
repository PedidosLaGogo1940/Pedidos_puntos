<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pedido de insumos · La GoGo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --cream: #E7F1E9;
  --cream-dark: #CFE1D4;
  --crust: #24543A;
  --ink: #183326;
  --wheat: #8DB59A;
  --wheat-dark: #5F8F70;
  --brick: #8C3B2E;
  --line: #B9CEBF;
  --white: #FFFFFF;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}

/* =========================
   ENCABEZADO
   ========================= */

header{
  background:var(--crust);
  color:var(--cream);
  padding:22px 20px 20px;
  border-bottom:4px solid var(--wheat);
}

header .marca{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  letter-spacing:0.2px;
  margin:0;
}

header .sub{
  margin:4px 0 0;
  font-size:13.5px;
  color:#DCEBE0;
}

/* =========================
   CONTENIDO
   ========================= */

.contenido{
  max-width:640px;
  margin:0 auto;
  padding:18px 16px 0;
}

/* =========================
   TARJETA PUNTO
   ========================= */

.tarjeta-punto{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:16px;
}

.tarjeta-punto label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--crust);
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:6px;
}

select#punto,
input#responsable{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:16px;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:var(--white);
  color:var(--ink);
}

input#responsable{
  margin-bottom:2px;
}

select#punto:focus,
input#responsable:focus,
textarea#nota:focus{
  outline:none;
  border-color:var(--wheat-dark);
  box-shadow:0 0 0 2px var(--cream-dark);
}

/* =========================
   CATEGORÍAS
   ========================= */

.categoria{
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:12px;
  background:var(--white);
  overflow:hidden;
}

.categoria-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  cursor:pointer;
  user-select:none;
}

.categoria-header h2{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:17px;
  margin:0;
  color:var(--crust);
}

.categoria-meta{
  display:flex;
  align-items:center;
  gap:10px;
}

.contador{
  font-size:12.5px;
  font-weight:600;
  color:var(--crust);
  background:var(--cream-dark);
  border-radius:20px;
  padding:3px 10px;
  min-width:20px;
  text-align:center;
}

.flecha{
  width:11px;
  height:11px;
  border-right:2px solid var(--crust);
  border-bottom:2px solid var(--crust);
  transform:rotate(45deg);
  transition:transform .18s ease;
  margin-right:2px;
}

.categoria.abierta .flecha{
  transform:rotate(-135deg);
}

.lista-items{
  max-height:0;
  overflow:hidden;
  transition:max-height .22s ease;
}

.lista-items-inner{
  padding:0 14px 6px;
}

.fila-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 2px;
  border-top:1px solid var(--cream-dark);
}

.fila-item:first-child{
  border-top:none;
}

.fila-item input[type=checkbox]{
  width:22px;
  height:22px;
  flex-shrink:0;
  accent-color:var(--wheat-dark);
}

.fila-item .nombre{
  flex:1;
  font-size:15px;
  line-height:1.3;
}

.fila-item input.cantidad{
  width:78px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:7px 8px;
  border:1.5px solid var(--line);
  border-radius:7px;
  text-align:center;
  display:none;
  background:var(--cream);
  color:var(--ink);
}

.fila-item.marcado input.cantidad{
  display:block;
}

.fila-item.marcado .nombre{
  color:var(--crust);
  font-weight:600;
}

/* =========================
   NOTA
   ========================= */

.nota-bloque{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:20px;
}

.nota-bloque label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--crust);
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:6px;
}

textarea#nota{
  width:100%;
  min-height:60px;
  font-family:'Inter',sans-serif;
  font-size:15px;
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  resize:vertical;
  background:var(--white);
  color:var(--ink);
}

/* =========================
   MENSAJES
   ========================= */

.banner{
  border-radius:9px;
  padding:11px 14px;
  font-size:13.5px;
  margin-bottom:16px;
  display:none;
}

.banner.error{
  background:#F6E2DC;
  color:var(--brick);
  border:1px solid #E0B4A6;
}

.banner.exito{
  background:#E1EFE5;
  color:#24543A;
  border:1px solid #B7D2BF;
}

.banner.mostrar{
  display:block;
}

/* =========================
   PIE DE PÁGINA
   ========================= */

footer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--crust);
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  box-shadow:0 -3px 14px rgba(0,0,0,.18);
}

footer .resumen{
  color:#DCEBE0;
  font-size:13px;
  line-height:1.25;
}

footer .resumen strong{
  color:var(--cream);
  font-size:15px;
  display:block;
}

button#enviar{
  background:var(--wheat);
  color:var(--crust);
  border:none;
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:15px;
  padding:13px 20px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
}

button#enviar:hover{
  background:var(--wheat-dark);
  color:#FFFFFF;
}

button#enviar:disabled{
  background:#718C7A;
  color:#DCEBE0;
  cursor:not-allowed;
}

button#enviar.cargando{
  opacity:.75;
}

</style>
</head>

<body>

<header>
  <p class="marca">La GoGo</p>
  <p class="sub">
    Pedido de insumos por punto · marca lo que se necesita y envía
  </p>
</header>


<div class="contenido">

  <!-- =========================
       PUNTO Y RESPONSABLE
       ========================= -->

  <div class="tarjeta-punto">

    <label for="punto">Tu punto</label>

    <select id="punto">
      <option value="">Selecciona tu punto…</option>
      <option value="QUINTA">Quinta</option>
      <option value="VERGEL">Vergel</option>
      <option value="POLA">Pola</option>
      <option value="PIEDRA PINTADA">Piedra Pintada</option>
    </select>


    <label for="responsable" style="margin-top:14px;">
      Responsable del pedido
    </label>

    <input
      type="text"
      id="responsable"
      placeholder="Escribe tu nombre"
      autocomplete="name"
    >

  </div>


  <div class="banner error" id="banner-error"></div>

  <div class="banner exito" id="banner-exito"></div>


  <div id="categorias"></div>


  <div class="nota-bloque">

    <label for="nota">
      Algo más que quieras aclarar (opcional)
    </label>

    <textarea
      id="nota"
      placeholder="Ej: la leche entera se acaba hoy mismo, urgente."
    ></textarea>

  </div>

</div>


<footer>

  <div class="resumen">

    <strong id="conteo-seleccion">
      0 productos
    </strong>

    seleccionados

  </div>

  <button id="enviar">
    Enviar pedido
  </button>

</footer>


<script>

/* =========================================================
   PRODUCTOS
   ========================================================= */

var DATOS = [

  {
    categoria: "Bebidas y desechables de barra",
    items: [
      "Masato",
      "Kumis",
      "Nescafé Tradición",
      "Capuchino rojo",
      "Capuchino vainilla",
      "Milo",
      "Vasos 6 oz",
      "Vasos 9 oz",
      "Vasos obsequio 7 oz",
      "Vaso 16 oz",
      "Tapas 6 oz",
      "Tapas 9 oz",
      "Mezcladores",
      "Cucharas",
      "Azúcar en sobre",
      "Leche deslactosada",
      "Leche entera",
      "Huevos"
    ]
  },

  {
    categoria: "Bolsas y empaques",
    items: [
      "Bolsa para calado",
      "Bolsa para cuca",
      "Bolsa para pan grande",
      "Bolsa manija La GoGo",
      "Bolsa manija grande",
      "Bolsa para tapar pan",
      "Bolsa de la basura"
    ]
  },

  {
    categoria: "Cajas y contenedores",
    items: [
      "Cajas porción",
      "Cajas media libra",
      "Cajas de libra",
      "Domos fantasía personal",
      "Contenedores muffin"
    ]
  },

  {
    categoria: "Papelería, cocina y despacho",
    items: [
      "Papel aluminio",
      "Papel sulfito",
      "Palillo extralargo",
      "Rollo de impresora",
      "Hojas de inventario",
      "Hojas de baja"
    ]
  },

  {
    categoria: "Aseo",
    items: [
      "Jabón de loza crema",
      "Jabón de loza líquido",
      "Jabón líquido de manos",
      "Citronela",
      "Desengrasante",
      "Limpiavidrios",
      "Waypall",
      "Papel higiénico",
      "Servilletas",
      "Jabón en polvo",
      "Guantes de manipulación de alimentos",
      "Esponja",
      "Insecticida",
      "Toallas de mano",
      "Servilletas de lujo",
      "Blanqueador",
      "Varsol emulsionado",
      "Vinagre",
      "Trapero",
      "Ambientador",
      "Bolsa precorte 8",
      "Bolsa precorte 6",
      "Bolsa precorte 10",
      "Bolsa precorte 12"
    ]
  }

];


/* =========================================================
   CREAR CATEGORÍAS
   ========================================================= */

var cont = document.getElementById('categorias');

DATOS.forEach(function(grupo, gi){

  var wrap = document.createElement('div');

  wrap.className = 'categoria';


  var head = document.createElement('div');

  head.className = 'categoria-header';

  head.innerHTML =
    '<h2>' + grupo.categoria + '</h2>' +
    '<div class="categoria-meta">' +
      '<span class="contador" data-cont="' + gi + '">0</span>' +
      '<span class="flecha"></span>' +
    '</div>';


  var lista = document.createElement('div');

  lista.className = 'lista-items';


  var inner = document.createElement('div');

  inner.className = 'lista-items-inner';


  grupo.items.forEach(function(nombre, ii){

    var fila = document.createElement('div');

    fila.className = 'fila-item';


    var id = 'chk-' + gi + '-' + ii;


    fila.innerHTML =
      '<input type="checkbox" id="' + id +
      '" data-cat="' + grupo.categoria +
      '" data-nombre="' + nombre + '">' +

      '<span class="nombre">' +
      nombre +
      '</span>' +

      '<input type="text" class="cantidad" placeholder="Cant.">';


    inner.appendChild(fila);

  });


  lista.appendChild(inner);

  wrap.appendChild(head);

  wrap.appendChild(lista);

  cont.appendChild(wrap);


  /* Abrir / cerrar categoría */

  head.addEventListener('click', function(){

    var abierta = wrap.classList.contains('abierta');


    if (abierta){

      wrap.classList.remove('abierta');

      lista.style.maxHeight = null;

    }else{

      wrap.classList.add('abierta');

      lista.style.maxHeight =
        inner.scrollHeight + 'px';

    }

  });

});


/* =========================================================
   CHECKBOX
   ========================================================= */

document
  .querySelectorAll('.fila-item input[type=checkbox]')
  .forEach(function(chk){

    chk.addEventListener('change', function(){

      var fila = chk.closest('.fila-item');

      fila.classList.toggle(
        'marcado',
        chk.checked
      );

      actualizarContadores();

    });

  });


/* =========================================================
   CONTADORES
   ========================================================= */

function actualizarContadores(){

  var total = 0;


  document
    .querySelectorAll('.categoria')
    .forEach(function(cat){

      var marcados =
        cat.querySelectorAll(
          '.fila-item.marcado'
        ).length;


      var badge =
        cat.querySelector('.contador');


      badge.textContent = marcados;


      total += marcados;


      var lista =
        cat.querySelector('.lista-items');


      if(cat.classList.contains('abierta')){

        lista.style.maxHeight =
          cat.querySelector(
            '.lista-items-inner'
          ).scrollHeight + 'px';

      }

    });


  document.getElementById(
    'conteo-seleccion'
  ).textContent =
    total +
    (total === 1
      ? ' producto'
      : ' productos');

}


/* =========================================================
   MENSAJES
   ========================================================= */

function mostrarError(msg){

  var b =
    document.getElementById(
      'banner-error'
    );

  b.textContent = msg;

  b.classList.add('mostrar');

  document.getElementById(
    'banner-exito'
  ).classList.remove('mostrar');

}


function mostrarExito(msg){

  var b =
    document.getElementById(
      'banner-exito'
    );

  b.textContent = msg;

  b.classList.add('mostrar');

  document.getElementById(
    'banner-error'
  ).classList.remove('mostrar');

}


/* =========================================================
   WHATSAPP
   ========================================================= */

var NUMERO_WHATSAPP = '573176398636';


/* =========================================================
   URL DE APPS SCRIPT
   ========================================================= */

var APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzGm8OfZltOpci60sgZYRcngxbBzdQ0FIi9a4xsOcrG-T1D_v-9c5t5goYiDSQmosLgOA/exec';


/* =========================================================
   ENVIAR PEDIDO
   ========================================================= */

document
  .getElementById('enviar')
  .addEventListener('click', function(){

    var boton = this;


    var punto =
      document.getElementById(
        'punto'
      ).value;


    var responsable =
      document.getElementById(
        'responsable'
      ).value.trim();


    var nota =
      document.getElementById(
        'nota'
      ).value.trim();


    var marcados =
      document.querySelectorAll(
        '.fila-item.marcado'
      );


    /* Validar punto */

    if(!punto){

      mostrarError(
        'Selecciona tu punto antes de enviar el pedido.'
      );

      return;

    }


    /* Validar responsable */

    if(!responsable){

      mostrarError(
        'Escribe el nombre del responsable del pedido.'
      );

      return;

    }


    /* Validar productos */

    if(marcados.length === 0){

      mostrarError(
        'Marca al menos un producto que necesites.'
      );

      return;

    }


    /* Crear lista de productos */

    var items = [];


    marcados.forEach(function(fila){

      var chk =
        fila.querySelector(
          'input[type=checkbox]'
        );


      var cant =
        fila.querySelector(
          'input.cantidad'
        ).value.trim();


      items.push({

        categoria:
          chk.getAttribute(
            'data-cat'
          ),

        producto:
          chk.getAttribute(
            'data-nombre'
          ),

        cantidad:
          cant

      });

    });


    /* Validar conexión */

    if(
      APPS_SCRIPT_URL.indexOf('http') !== 0
    ){

      mostrarError(
        'Falta configurar la conexión con la hoja de cálculo (APPS_SCRIPT_URL). Avísale a quien administra la página.'
      );

      return;

    }


    boton.disabled = true;

    boton.classList.add('cargando');

    boton.textContent = 'Enviando…';


    /* Pedido completo */

    var pedido = {

      punto: punto,

      responsable: responsable,

      nota: nota,

      items: items

    };


    /* Enviar a Google Sheets */

    fetch(APPS_SCRIPT_URL, {

      method: 'POST',

      headers: {
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body:
        JSON.stringify(pedido)

    })

    .then(function(resp){

      return resp.json();

    })

    .then(function(data){

      if(
        !data ||
        !data.ok
      ){

        throw new Error(
          data && data.error
            ? data.error
            : 'respuesta inválida'
        );

      }


      enviarWhatsApp(pedido);


      mostrarExito(
        'Pedido guardado. Abriendo WhatsApp para confirmarlo…'
      );

    })

    .catch(function(err){

      mostrarError(
        'No se pudo guardar el pedido. Intenta de nuevo. (' +
        err.message +
        ')'
      );

    })

    .finally(function(){

      boton.disabled = false;

      boton.classList.remove(
        'cargando'
      );

      boton.textContent =
        'Enviar pedido';

    });

  });


/* =========================================================
   ENVIAR WHATSAPP
   ========================================================= */

function enviarWhatsApp(pedido){

  var fecha =
    new Date().toLocaleDateString(
      'es-CO',
      {
        day:'2-digit',
        month:'2-digit',
        year:'numeric'
      }
    );


  var texto =
    'Pedido de insumos - La GoGo\n' +
    'Punto: ' + pedido.punto + '\n' +
    'Responsable: ' + pedido.responsable + '\n' +
    'Fecha: ' + fecha + '\n\n';


  var porCategoria = {};


  pedido.items.forEach(function(it){

    if(
      !porCategoria[it.categoria]
    ){

      porCategoria[it.categoria] = [];

    }


    porCategoria[
      it.categoria
    ].push(

      it.producto +
      (
        it.cantidad
          ? ' x' + it.cantidad
          : ''
      )

    );

  });


  Object.keys(
    porCategoria
  ).forEach(function(cat){

    texto +=
      '*' + cat + '*\n';


    porCategoria[
      cat
    ].forEach(function(linea){

      texto +=
        '- ' + linea + '\n';

    });


    texto += '\n';

  });


  if(pedido.nota){

    texto +=
      'Nota: ' +
      pedido.nota;

  }


  var url =
    'https://wa.me/' +
    NUMERO_WHATSAPP +
    '?text=' +
    encodeURIComponent(texto);


  window.open(
    url,
    '_blank'
  );

}

</script>

</body>
</html>
